<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piezas 3D realistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: showroom técnico de M&T, sobrio y con brillo de producto
   IDEA: vitrina nocturna donde cada componente se gira y se desarma como en una mesa de exhibición
   PICTURE: cada pieza modelada en código con materiales metálicos, PCB con pistas y contactos dorados
   COLOUR and TYPE: escenario #061018, menta #36e39a; Space Grotesk + Inter
   LAYOUT: rejilla de tarjetas con miniatura renderizada; visor grande con ficha y controles */
:root{color-scheme:dark;--bg:#061018;--card:#0d1f27;--line:#1c3540;--ink:#e4efec;--mute:#91a9af;--acc:#36e39a;--accInk:#052016;--warn:#fbbf24;--bad:#ff7b7b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}.wrap{max-width:1240px;margin:auto}
header h1{font-size:clamp(30px,4.2vw,48px)}header p{color:var(--mute);max-width:64ch;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;font:inherit;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:#2f6b5a;transform:translateY(-2px)}.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.thumb{aspect-ratio:4/3;background:radial-gradient(90% 90% at 50% 35%,#13303a,#08161d 75%);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.cbody{padding:14px 16px 16px;display:grid;gap:4px}
.cat{font-size:13px;color:var(--mute)}.cbody h3{font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.price{font:700 20px "Space Grotesk",sans-serif;white-space:nowrap}
.badge{font-size:13px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.ok{color:var(--acc);background:#0c2a22}.lo{color:var(--warn);background:#2a2208}.out{color:var(--bad);background:#2c1214}
.note{font-size:13px;color:var(--mute);margin-top:18px}
/* Visor */
.visor{position:fixed;inset:0;z-index:50;background:rgba(3,9,13,.92);display:grid;grid-template-columns:minmax(0,1fr) 360px}
.visor[hidden]{display:none}
.stage{position:relative;background:radial-gradient(80% 80% at 50% 40%,#123039,#061018 75%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.hint{position:absolute;left:16px;bottom:14px;font-size:13px;color:#8fb0b8;pointer-events:none}
.side{background:var(--card);border-left:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.side h2{font-size:26px}.desc{color:#a9c1c6;font-size:15px}
.specs{margin:0;padding:0;list-style:none;font-size:14px}.specs li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.specs span{color:var(--mute)}
button{min-height:44px;border-radius:10px;padding:0 16px;border:1px solid #24434f;background:transparent;color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer}
button.prim{background:var(--acc);color:var(--accInk);border-color:transparent}
button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
label.sl{display:grid;gap:6px;font-size:14px;color:var(--mute)}input[type=range]{width:100%;accent-color:var(--acc);min-height:24px}
.close{position:absolute;top:14px;right:14px;z-index:2;background:rgba(6,16,24,.8)}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}
@media(max-width:860px){.visor{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side{border-left:0;border-top:1px solid var(--line);max-height:46vh}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1>Componentes en 3D, hechos solo con código</h1>
    <p>Cada pieza está modelada con three.js: sin archivos 3D, sin fotos y sin herramientas de pago. Toca una para girarla, acercarla y desarmarla.</p>
    <div class="grid" id="grid"></div>
    <p class="note">Precios y existencias de ejemplo del catálogo de M&amp;T.</p>
  </div>
</header>

<div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-labelledby="vNombre">
  <div class="stage" id="stage">
    <button class="close" id="cerrar" aria-label="Cerrar visor">Cerrar</button>
    <div class="hint">Arrastra para girar · rueda o pellizco para acercar</div>
  </div>
  <aside class="side">
    <span class="cat" id="vCat"></span>
    <h2 id="vNombre"></h2>
    <p class="desc" id="vDesc"></p>
    <div class="row"><span class="price" id="vPrecio"></span><span id="vStock"></span></div>
    <ul class="specs" id="vSpecs"></ul>
    <label class="sl" id="slWrap">Separar piezas<input type="range" id="sep" min="0" max="1" step="0.01" value="0"></label>
    <div class="ctrls">
      <button id="bAuto" aria-pressed="true">Giro automático</button>
      <button id="bReset">Centrar vista</button>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
{
const T = window.THREE;
const $ = (s) => document.querySelector(s);
const money = (v) => '$' + v.toLocaleString('es-MX');

/* ================= Texturas generadas con canvas ================= */
const texCache = {};
function canvasTex(key, w, h, draw, opts = {}) {
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  if (!opts.data) t.encoding = T.sRGBEncoding;
  t.anisotropy = 8;
  if (opts.repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(...opts.repeat); }
  return (texCache[key] = t);
}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// Tarjeta de circuito: color de máscara, pistas, vías y serigrafía. Devuelve {map, bump}
function pcb(key, color, w = 1024, h = 512, seed = 7) {
  const trazos = (ctx, claro) => {
    const r = rnd(seed);
    ctx.lineCap = 'round';
    for (let i = 0; i < 90; i++) {
      let x = r() * w, y = r() * h;
      ctx.beginPath(); ctx.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        const d = 20 + r() * 120, dir = Math.floor(r() * 8) * Math.PI / 4;
        x += Math.cos(dir) * d; y += Math.sin(dir) * d; ctx.lineTo(x, y);
      }
      ctx.lineWidth = 1 + r() * 2.5; ctx.strokeStyle = claro; ctx.stroke();
    }
    for (let i = 0; i < 260; i++) { ctx.beginPath(); ctx.arc(r() * w, r() * h, 1.5 + r() * 2, 0, 7); ctx.fillStyle = claro; ctx.fill(); }
  };
  const map = canvasTex(key + 'm', w, h, (ctx) => {
    ctx.fillStyle = color; ctx.fillRect(0, 0, w, h);
    trazos(ctx, 'rgba(255,255,255,.07)');
    const r = rnd(seed + 3);
    ctx.strokeStyle = 'rgba(235,240,235,.55)'; ctx.fillStyle = 'rgba(235,240,235,.6)'; ctx.font = '14px monospace'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 26; i++) {
      const x = r() * w, y = r() * h, bw = 14 + r() * 40, bh = 8 + r() * 24;
      ctx.strokeRect(x, y, bw, bh); if (r() > .6) ctx.fillText(['C', 'R', 'U', 'Q', 'L'][i % 5] + Math.floor(r() * 900), x, y - 3);
    }
  });
  const bump = canvasTex(key + 'b', w, h, (ctx) => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); trazos(ctx, '#fff'); }, { data: true });
  return { map, bump };
}
// Aluminio cepillado
function cepillado(key, base, w = 512, h = 512) {
  return canvasTex(key, w, h, (ctx) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const r = rnd(11);
    for (let i = 0; i < 1400; i++) { const y = r() * h; ctx.fillStyle = `rgba(255,255,255,${r() * .06})`; ctx.fillRect(0, y, w, 1); ctx.fillStyle = `rgba(0,0,0,${r() * .08})`; ctx.fillRect(0, r() * h, w, 1); }
  });
}
// Etiqueta con textos
function etiqueta(key, w, h, bg, fg, lineas, extra) {
  return canvasTex(key, w, h, (ctx) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    if (extra) extra(ctx, w, h);
    ctx.fillStyle = fg; ctx.textBaseline = 'middle';
    lineas.forEach(([txt, size, x, y, peso = '700', alin = 'left', color]) => {
      ctx.font = `${peso} ${size}px "Space Grotesk", Arial, sans-serif`; ctx.textAlign = alin; ctx.fillStyle = color || fg; ctx.fillText(txt, x, y);
    });
  });
}
// Degradado RGB (se desplaza para animar)
const rgbTex = canvasTex('rgb', 512, 8, (ctx, w) => {
  const g = ctx.createLinearGradient(0, 0, w, 0);
  ['#ff2d55', '#ffb020', '#36e39a', '#22d3ee', '#7c5cff', '#ff2d55'].forEach((c, i, a) => g.addColorStop(i / (a.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, 8);
}, { repeat: [1, 1] });

/* ================= Materiales ================= */
const M = {
  oro: new T.MeshStandardMaterial({ color: 0xe3b04b, metalness: 1, roughness: .28 }),
  cobre: new T.MeshStandardMaterial({ color: 0xc8733f, metalness: 1, roughness: .3 }),
  niquel: new T.MeshStandardMaterial({ color: 0xd9dde0, metalness: 1, roughness: .22 }),
  acero: new T.MeshStandardMaterial({ color: 0xa9b0b5, metalness: .9, roughness: .38 }),
  aluminio: new T.MeshStandardMaterial({ color: 0xc9ced3, metalness: .85, roughness: .32 }),
  grafito: new T.MeshStandardMaterial({ color: 0x2b3136, metalness: .75, roughness: .38 }),
  negroMate: new T.MeshStandardMaterial({ color: 0x15181b, metalness: .1, roughness: .7 }),
  plastico: new T.MeshStandardMaterial({ color: 0x101214, metalness: 0, roughness: .6 }),
  plasticoGris: new T.MeshStandardMaterial({ color: 0x3a4046, metalness: 0, roughness: .55 }),
  chip: new T.MeshStandardMaterial({ color: 0x18191b, metalness: .2, roughness: .45 }),
  ceramica: new T.MeshStandardMaterial({ color: 0x8a6a45, metalness: .1, roughness: .5 }),
  rgb: new T.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveMap: rgbTex, map: rgbTex, emissiveIntensity: 1.6, roughness: .4 }),
  aspaTranslucida: new T.MeshPhysicalMaterial({ color: 0x14181c, metalness: 0, roughness: .3, transparent: true, opacity: .9, clearcoat: .5, clearcoatRoughness: .25 }),
};
const pcbMat = (key, color, rep = [1, 1], seed) => {
  const t = pcb(key, color, 1024, 512, seed); [t.map, t.bump].forEach((x) => { x.wrapS = x.wrapT = T.RepeatWrapping; x.repeat.set(...rep); });
  return new T.MeshPhysicalMaterial({ map: t.map, bumpMap: t.bump, bumpScale: .015, roughness: .5, metalness: .05, clearcoat: .25, clearcoatRoughness: .35 });
};
const brushMat = (key, base, metal = .85, rough = .35) => new T.MeshStandardMaterial({ map: cepillado(key, base), metalness: metal, roughness: rough });
const etiquetaMat = (tex, rough = .55) => new T.MeshStandardMaterial({ map: tex, roughness: rough, metalness: .05 });

/* ================= Ayudas de geometría ================= */
const caja = (w, h, d, mat, x = 0, y = 0, z = 0, par) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; par && par.add(m); return m; };
const rcaja = (w, h, d, r, mat, x = 0, y = 0, z = 0, par) => { const m = new T.Mesh(new T.RoundedBoxGeometry(w, h, d, 3, r), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; par && par.add(m); return m; };
const cil = (rt, rb, h, mat, x = 0, y = 0, z = 0, par, seg = 32) => { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; par && par.add(m); return m; };
const plano = (w, h, mat, x = 0, y = 0, z = 0, par) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.receiveShadow = true; par && par.add(m); return m; };
// Repite una misma pieza muchas veces de forma eficiente
function repetir(geo, mat, posiciones, par) {
  const im = new T.InstancedMesh(geo, mat, posiciones.length);
  const o = new T.Object3D();
  posiciones.forEach((p, i) => { o.position.set(p[0], p[1], p[2]); o.rotation.set(p[3] || 0, p[4] || 0, p[5] || 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  im.castShadow = im.receiveShadow = true; par && par.add(im); return im;
}
// Forma redondeada para extruir
function rectRedondo(w, h, r) {
  const s = new T.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
const agujero = (x, y, r) => { const p = new T.Path(); p.absarc(x, y, r, 0, Math.PI * 2, true); return p; };
const extruir = (shape, prof, mat, bevel = .04) => {
  const g = new T.ExtrudeGeometry(shape, { depth: prof, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 40 });
  g.translate(0, 0, -prof / 2);
  const m = new T.Mesh(g, mat); m.castShadow = m.receiveShadow = true; return m;
};
// Ventilador: aro, aspas curvas y centro con etiqueta
const aspasGiratorias = [];
function ventilador(radio, { aro = true, rgb = false, aspas = 9, matAspa = M.aspaTranslucida } = {}) {
  const g = new T.Group();
  const aspa = new T.Shape();
  aspa.moveTo(radio * .22, -radio * .05);
  aspa.quadraticCurveTo(radio * .62, -radio * .32, radio * .93, -radio * .1);
  aspa.quadraticCurveTo(radio * .8, radio * .2, radio * .26, radio * .14);
  aspa.quadraticCurveTo(radio * .2, radio * .05, radio * .22, -radio * .05);
  const geoAspa = new T.ExtrudeGeometry(aspa, { depth: radio * .012, bevelEnabled: true, bevelThickness: radio * .006, bevelSize: radio * .006, bevelSegments: 2, curveSegments: 16 });
  const rotor = new T.Group();
  for (let i = 0; i < aspas; i++) {
    const m = new T.Mesh(geoAspa, matAspa); m.castShadow = true;
    const piv = new T.Group(); piv.rotation.z = (i / aspas) * Math.PI * 2; m.rotation.y = .38; piv.add(m); rotor.add(piv);
  }
  const hubTex = etiqueta('hub', 256, 256, '#121416', '#cfd6da', [['M&T', 56, 128, 128, '700', 'center']], (ctx) => { ctx.strokeStyle = '#2c3237'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(128, 128, 112, 0, 7); ctx.stroke(); });
  const hub = cil(radio * .25, radio * .25, radio * .16, [M.plastico, etiquetaMat(hubTex, .4), M.plastico], 0, 0, radio * .02, rotor);
  hub.rotation.x = Math.PI / 2;
  g.add(rotor); aspasGiratorias.push(rotor);
  if (aro) {
    const t = new T.Mesh(new T.TorusGeometry(radio * 1.02, radio * .045, 16, 96), rgb ? M.rgb : M.plastico);
    t.castShadow = true; g.add(t);
  }
  return g;
}

/* ================= Modelos (unidades en centímetros) ================= */
const MODELOS = {
  ram() {
    const g = new T.Group(), partes = [];
    const pcbM = pcbMat('pcbRam', '#0c3a2c', [2, .5], 3);
    const disipador = new T.MeshStandardMaterial({ map: cepillado('ramAl', '#3a4047'), metalness: .85, roughness: .34 });
    const lbl = etiqueta('ramLbl', 1024, 160, '#1a1e22', '#e7ecef', [['M&T VANGUARD', 64, 40, 62], ['DDR5-6000  16 GB  CL30  1.35 V', 34, 40, 122, '500', 'left', '#9aa6ad']], (ctx) => { ctx.fillStyle = '#36e39a'; ctx.fillRect(0, 150, 1024, 10); });
    [-0.55, 0.55].forEach((z, idx) => {
      const mod = new T.Group(); mod.position.z = z;
      caja(13.3, 3.1, .1, pcbM, 0, -.2, 0, mod);
      // contactos dorados en ambas caras, con la muesca fuera del centro
      const pos = [];
      for (let i = 0; i < 72; i++) { const x = -6.4 + i * .18 + (i >= 34 ? .25 : 0); pos.push([x, -1.6, .056], [x, -1.6, -.056]); }
      repetir(new T.BoxGeometry(.11, .42, .01), M.oro, pos, mod);
      // chips de memoria visibles abajo del disipador
      for (let i = 0; i < 4; i++) caja(1.1, .55, .06, M.chip, -4.5 + i * 3, -1.05, .08, mod);
      // disipador de dos placas con bisel
      const frente = rcaja(13.1, 2.55, .16, .06, disipador, 0, .12, .16, mod);
      const atras = rcaja(13.1, 2.55, .16, .06, disipador, 0, .12, -.16, mod);
      const tapa = rcaja(13.1, .32, .5, .1, M.grafito, 0, 1.45, 0, mod);
      plano(10.5, 1.64, etiquetaMat(lbl, .5), -.8, -.02, .085, frente); // la etiqueta viaja con la placa frontal
      // difusor RGB superior
      const luz = rcaja(12.8, .38, .34, .12, M.rgb, 0, 1.75, 0, mod);
      g.add(mod);
      partes.push({ obj: frente, off: [0, 0, 1.4 * (idx ? 1 : 1)] }, { obj: atras, off: [0, 0, -1.4] }, { obj: tapa, off: [0, 1.6, 0] }, { obj: luz, off: [0, 2.6, 0] });
    });
    g.rotation.x = -.05;
    return { g, partes };
  },

  cpu() {
    const g = new T.Group(), partes = [];
    const sustrato = pcbMat('pcbCpu', '#14452f', [1, 1], 21);
    caja(4.0, .12, 4.0, sustrato, 0, 0, 0, g);
    // capacitores pequeños alrededor del IHS
    const smd = [];
    for (let i = 0; i < 18; i++) { const a = i % 2 ? 1.75 : -1.75; smd.push([a, .08, -1.4 + Math.floor(i / 2) * .33]); }
    repetir(new T.BoxGeometry(.12, .05, .07), M.ceramica, smd, g);
    // IHS niquelado con texto grabado
    const s = rectRedondo(3.3, 3.3, .25);
    const ihsTex = etiqueta('ihs', 1024, 1024, '#c9cdd1', '#8d949a', [['RYZEN 7', 120, 512, 420, '700', 'center'], ['7700', 96, 512, 560, '700', 'center'], ['100-000000592  AM5', 44, 512, 700, '500', 'center']], (ctx, w, h) => {
      const r = rnd(5); for (let i = 0; i < 900; i++) { ctx.fillStyle = `rgba(255,255,255,${r() * .05})`; ctx.fillRect(r() * w, r() * h, 2, 2); }
    });
    const ihs = extruir(s, .22, new T.MeshStandardMaterial({ map: ihsTex, metalness: 1, roughness: .2 }), .05);
    ihs.rotation.x = -Math.PI / 2; ihs.position.y = .26;
    // ajusta las UV de la cara superior al tamaño del IHS
    const uv = ihs.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 3.3 + .5, uv.getY(i) / 3.3 + .5);
    g.add(ihs);
    // triángulo dorado de orientación
    const tri = new T.Shape(); tri.moveTo(0, 0); tri.lineTo(.35, 0); tri.lineTo(0, .35); tri.closePath();
    const t = new T.Mesh(new T.ShapeGeometry(tri), M.oro); t.rotation.x = -Math.PI / 2; t.position.set(-1.9, .065, 1.9); g.add(t);
    // contactos dorados por abajo
    const pads = []; for (let i = 0; i < 34; i++) for (let j = 0; j < 34; j++) pads.push([-1.8 + i * .109, -.066, -1.8 + j * .109]);
    const contactos = repetir(new T.CylinderGeometry(.035, .035, .01, 8), M.oro, pads, g);
    partes.push({ obj: ihs, off: [0, 1.8, 0] }, { obj: contactos, off: [0, -.9, 0] });
    g.rotation.x = .35;
    return { g, partes };
  },

  placa() {
    const g = new T.Group(), partes = [];
    const pcbM = pcbMat('pcbMb', '#101416', [3, 2.4], 9);
    caja(30.5, .16, 24.4, pcbM, 0, 0, 0, g);
    const top = .08;
    // socket con marco metálico

/* ================= Motor de render ================= */
let R;
try { R = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); } catch (e) { R = null; }
const S = new T.Scene();
const C = new T.PerspectiveCamera(35, 1, .1, 500);
if (R) {
  R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
  R.physicallyCorrectLights = true; R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
  // Reflejos realistas: un "cuarto" virtual con luces suaves
  const pm = new T.PMREMGenerator(R);
  S.environment = pm.fromScene(new T.RoomEnvironment(), .04).texture;
}
const sol = new T.DirectionalLight(0xffffff, 2.2); sol.position.set(6, 12, 8); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -.0004; sol.shadow.radius = 4; S.add(sol);
const rim = new T.DirectionalLight(0x7fe9c0, .9); rim.position.set(-8, 4, -6); S.add(rim);
const piso = new T.Mesh(new T.PlaneGeometry(200, 200), new T.ShadowMaterial({ opacity: .35 })); piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; S.add(piso);

let actual = null; // { g, partes, base: [] }
function construir(id) {
  if (actual) { S.remove(actual.g); }
  aspasGiratorias.length = 0;
  const m = MODELOS[id]();
  // centrar y apoyar en el piso
  const caja3 = new T.Box3().setFromObject(m.g), c = caja3.getCenter(new T.Vector3());
  m.g.position.sub(new T.Vector3(c.x, caja3.min.y, c.z));
  m.partes.forEach((p) => { p.base = p.obj.position.clone(); p.offV = new T.Vector3(...p.off); });
  // Los plásticos y la fibra de la PCB reflejan menos el entorno que los metales
  m.g.traverse((o) => {
    if (!o.isMesh) return;
    [].concat(o.material).forEach((mat) => {
      if (mat.userData.ajustado) return;
      mat.userData.ajustado = true;
      mat.envMapIntensity = mat.emissiveMap ? 1 : mat.metalness >= .5 ? 1 : .32;
    });
  });
  S.add(m.g);
  const tam = caja3.getSize(new T.Vector3());
  m.radio = Math.max(tam.x, tam.y, tam.z) * .62; m.altura = tam.y;
  actual = m;
  // sombra ajustada al tamaño de la pieza
  const r = m.radio * 1.6; Object.assign(sol.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: .1, far: r * 6 }); sol.shadow.camera.updateProjectionMatrix();
  sol.position.set(m.radio * .9, m.radio * 2.2, m.radio * 1.3); sol.target = m.g;
  return m;
}
function encuadrar(m, ctrl) {
  const d = m.radio / Math.sin((C.fov * Math.PI / 180) / 2) * .95;
  C.position.set(d * .55, m.altura * .5 + d * .45, d * .75);
  C.near = d / 100; C.far = d * 20; C.updateProjectionMatrix();
  if (ctrl) { ctrl.target.set(0, m.altura * .45, 0); ctrl.minDistance = d * .35; ctrl.maxDistance = d * 2.2; ctrl.update(); } else C.lookAt(0, m.altura * .45, 0);
}

  $('#slWrap').hidden = !m.partes.length;
  encuadrar(m, ctrl);
  auto = !reduce; $('#bAuto').setAttribute('aria-pressed', auto);
  cancelAnimationFrame(raf); ultimo = performance.now(); raf = requestAnimationFrame(loop);
  $('#cerrar').focus();
}
function cerrar() { visor.hidden = true; document.body.style.overflow = ''; cancelAnimationFrame(raf); const b = grid.querySelector(`[data-i="${abierto}"]`); b && b.focus(); }
let abierto = 0;
function loop(now) {
  const dt = Math.min((now - ultimo) / 1000, .05); ultimo = now;
  ctrl.autoRotate = auto; ctrl.update();
  aspasGiratorias.forEach((r) => { r.rotation.z += dt * (reduce ? 1 : 7); });
  rgbTex.offset.x = (rgbTex.offset.x + dt * .12) % 1;
  sep += (sepMeta - sep) * (1 - Math.pow(.001, dt));
  if (actual) actual.partes.forEach((p) => p.obj.position.copy(p.base).addScaledVector(p.offV, sep));
  R.render(S, C);
  raf = requestAnimationFrame(loop);
}

grid.addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) { abierto = +b.dataset.i; abrir(abierto); } });
$('#cerrar').addEventListener('click', cerrar);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !visor.hidden) cerrar(); });
$('#sep').addEventListener('input', (e) => { sepMeta = +e.target.value; });
$('#bAuto').addEventListener('click', () => { auto = !auto; $('#bAuto').setAttribute('aria-pressed', auto); });
$('#bReset').addEventListener('click', () => { if (actual) { encuadrar(actual, ctrl); sepMeta = 0; $('#sep').value = 0; } });
}
</script>
</body>
